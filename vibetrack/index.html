<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>VibeTrack</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: #f3f6f2;
        color: #24312b;
        font-family: Outfit, sans-serif;
      }
      .boot {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem 1.25rem;
      }
      .boot h1 {
        font-family: Fraunces, Georgia, serif;
        font-size: 2rem;
        margin: 0 0 0.5rem;
      }
      .boot p {
        margin: 0;
        color: #5d6b64;
        line-height: 1.45;
      }
      .boot code {
        font-family: ui-monospace, monospace;
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" id="boot">
        <h1>VibeTrack</h1>
        <p id="boot-message">Starting…</p>
      </div>
    </div>
    <script>
      // If React never mounts, the boot screen used to look like an infinite loader.
      window.setTimeout(function () {
        var root = document.getElementById('root')
        var message = document.getElementById('boot-message')
        if (!root || !message) return
        if (root.querySelector('.app')) return
        message.innerHTML =
          'The app did not start in this browser tab.<br><br>' +
          'This usually means the page HTML loaded, but the JavaScript could not reach the Cloud Agent.<br><br>' +
          'Fix: on your computer run<br>' +
          '<code>cd vibetrack && npm install && npm run build && npm run preview</code><br>' +
          'then open <code>http://localhost:4173</code>'
      }, 3500)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
